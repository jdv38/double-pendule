        ['Shortcuts', '<kbd>Space</kbd> play/pause · <kbd>R</kbd> reset pose · <kbd>C</kbd> clear trail · <kbd>F</kbd> fullscreen · <kbd>P</kbd> panel · <kbd>H</kbd> help'],

      ],
    },
  };

  let lang = localStorage.getItem('dp-lang') === 'en' ? 'en' : 'fr';
  const t = (k) => (I18N[lang] && I18N[lang][k]) || I18N.fr[k] || k;

  const TRAIL_SOFT_CAP = 100000;
  const PHYS_DT = 1 / 120;
  const TRAIL_SAMPLE_DT = 1 / 90;
  const TRAIL_MAX_GAP = 2.2;
  // Beyond this, treat as a teleport (don't densify / don't draw a chord)
  const TRAIL_BREAK = 48;
  const ENERGY_HIST = 240;
  const PHASE_HIST = 400;

  const DEFAULT_SETTINGS = {
    L1:1, L2:1, m1:1, m2:1, g:9.81, friction:0, timeScale:1, bg:'#2a2d33',
    trail:true, trailBoth:false, trailStyle:'gradient', trailC1:'#2a4a5e', trailC2:'#f0c27b',
    trailWidth:1.5, trailLen:900, trailInfinite:false, trailOpacity:0.55, trailFade:true, trailSoft:true,
    panSens:1, zoomSens:1, autoHide:false, showCharts:true, chartSize:1,
  };

  const PRESETS = {
    calm: { g:9.81, friction:0.08, timeScale:1, L1:1, L2:1, m1:1, m2:1,
      theta1:0.4, theta2:0.55, trailStyle:'gradient', trailC1:'#8fad9e', trailC2:'#d4c4a8' },
    chaotic: { g:9.81, friction:0, timeScale:1, L1:1, L2:1, m1:1, m2:1,
      theta1:2.2, theta2:2.6, trailStyle:'rainbow', trailBoth:false },
    friction: { g:9.81, friction:0.55, timeScale:1, L1:1.1, L2:0.9, m1:1, m2:1.4,
      theta1:2.8, theta2:1.2, trailStyle:'solid', trailC1:'#c47a6a', trailC2:'#f0c27b' },
    heavy: { g:9.81, friction:0.05, timeScale:1, L1:1, L2:1.2, m1:0.6, m2:2.6,
      theta1:1.8, theta2:2.4, trailStyle:'speed', trailC1:'#1b3a4b', trailC2:'#ff6b4a', trailBoth:true },
    fast: { g:12, friction:0.02, timeScale:3, L1:1, L2:1, m1:1, m2:1,
      theta1:2.0, theta2:2.8, trailStyle:'speed', trailC1:'#2a4a5e', trailC2:'#f0c27b' },
  };

  const state = {
    theta1: Math.PI * 0.65, theta2: Math.PI * 1.15, omega1:0, omega2:0, running:false,
    ...DEFAULT_SETTINGS,
  };

  let startPose = { theta1: state.theta1, theta2: state.theta2, omega1:0, omega2:0 };
  let pendulums = [];
  let basePivot = { x:0, y:0 }, pivot = { x:0, y:0 }, refScale = 160, scale = 160;
  let drag = null, panLast = null, hover = null, panelHidden = false, autoHideTimer = null;
  let trailSampleAcc = 0;
  let energyHist = [], phaseHist = [], e0 = null, stabilityBad = false;
  let speedPeak = 12; // shared absolute scale for both trails

  function zoomK() { return scale / refScale; }

  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 1600);
  }

  function renderHelp() {
    const body = $('help-body');
    const sections = (I18N[lang] && I18N[lang].helpSections) || I18N.fr.helpSections;
    body.innerHTML = sections.map(([title, text]) =>
      `<h3>${title}</h3><p>${text}</p>`
    ).join('');
  }

  function applyI18n() {
    document.documentElement.lang = lang;
    document.title = t('title') + (t('title') === 'Double pendule' ? ' – Simulation interactive du chaos' : ' – Interactive chaos simulator');
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = t(el.getAttribute('data-i18n-title')); });
    $('btn-play').textContent = state.running ? t('pause') : t('play');
    $('lang').value = lang;
    renderHelp();
    updateLabels();
  }

  let helpOpen = false;
  let rafId = 0;

  function setHelpOpen(open) {
    helpOpen = !!open;
    $('help').classList.toggle('open', helpOpen);
    if (helpOpen) {
      // Stop the render/physics loop while help is open
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = 0;
      }
    } else {
      last = performance.now();
      if (!rafId) rafId = requestAnimationFrame(frame);
    }
  }

  function makePendulum(th1, th2, w1=0, w2=0, hue=28) {
    return { theta1:th1, theta2:th2, omega1:w1, omega2:w2, trail1:[], trail2:[], last1:null, last2:null, hue };
  }

  function rebuildClones(keepPrimaryAngles = true) {
    const th1 = keepPrimaryAngles ? (pendulums[0]?.theta1 ?? state.theta1) : state.theta1;
    const th2 = keepPrimaryAngles ? (pendulums[0]?.theta2 ?? state.theta2) : state.theta2;
    pendulums = [makePendulum(th1, th2, 0, 0, 28)];
    syncPrimaryFromPendulum();
    trailSampleAcc = 0;
    energyHist = []; phaseHist = []; e0 = null;
    speedPeak = 12;
  }

  function syncPrimaryFromPendulum() {
    const p = pendulums[0];
    if (!p) return;
    state.theta1 = p.theta1; state.theta2 = p.theta2;
    state.omega1 = p.omega1; state.omega2 = p.omega2;
  }

  function syncPendulumFromPrimary() {
    if (!pendulums[0]) return;
    pendulums[0].theta1 = state.theta1; pendulums[0].theta2 = state.theta2;
    pendulums[0].omega1 = state.omega1; pendulums[0].omega2 = state.omega2;
  }

  function clearAllTrails() {
    for (const p of pendulums) {
      p.trail1.length = 0; p.trail2.length = 0; p.last1 = null; p.last2 = null;
    }
    trailSampleAcc = 0;
    energyHist = []; phaseHist = [];
  }

  function trimArr(arr) {
    const cap = state.trailInfinite ? TRAIL_SOFT_CAP : state.trailLen;
    while (arr.length > cap) arr.shift();
  }

  function pushPt(arr, lastKey, pend, x, y, speed = 0) {
    let last = pend[lastKey];
    if (last) {
      const dx = x - last.x, dy = y - last.y, dist = Math.hypot(dx, dy);
      if (dist < 0.15) {
        last.x = x; last.y = y;
        if (arr.length) {
          arr[arr.length - 1].x = x;
          arr[arr.length - 1].y = y;
          arr[arr.length - 1].spd = speed;
        }
        return;
      }
      // Teleport / discontinuity: break the polyline (avoids star chords through the pivot)
      if (dist > TRAIL_BREAK) {
        arr.push({ x, y, spd: speed, brk: true });
        pend[lastKey] = { x, y, spd: speed };
        trimArr(arr);
        return;
      }
      if (dist > TRAIL_MAX_GAP) {
        const n = Math.min(24, Math.ceil(dist / TRAIL_MAX_GAP));
        for (let i = 1; i < n; i++) {
          const t = i / n;
          arr.push({
            x: last.x + dx * t,
            y: last.y + dy * t,
            spd: (last.spd || speed) * (1 - t) + speed * t,
          });
        }
      }
    }
    arr.push({ x, y, spd: speed });
    pend[lastKey] = { x, y, spd: speed };
    trimArr(arr);
    if (arr.length) {
      const lastPt = arr[arr.length - 1];
      pend[lastKey] = { x: lastPt.x, y: lastPt.y, spd: lastPt.spd || 0 };
    }
  }

  function panBy(dx, dy) {
    if (!dx && !dy) return;
    pivot.x += dx; pivot.y += dy;
    for (const p of pendulums) {
      for (const a of [p.trail1, p.trail2]) for (const q of a) { q.x += dx; q.y += dy; }
      if (p.last1) { p.last1.x += dx; p.last1.y += dy; }
      if (p.last2) { p.last2.x += dx; p.last2.y += dy; }
    }
  }

  function zoomAt(mx, my, factor) {
    const next = Math.min(refScale * 8, Math.max(refScale * 0.2, scale * factor));
    const f = next / scale;
    if (Math.abs(f - 1) < 1e-6) return;
    const xf = (q) => { q.x = mx + (q.x - mx) * f; q.y = my + (q.y - my) * f; };
    pivot.x = mx + (pivot.x - mx) * f; pivot.y = my + (pivot.y - my) * f;
    for (const p of pendulums) {
      p.trail1.forEach(xf); p.trail2.forEach(xf);
      if (p.last1) xf(p.last1); if (p.last2) xf(p.last2);
    }
    scale = next;
  }

  function positionsOf(p) {
    const x1 = pivot.x + state.L1 * scale * Math.sin(p.theta1);
    const y1 = pivot.y + state.L1 * scale * Math.cos(p.theta1);
    const x2 = x1 + state.L2 * scale * Math.sin(p.theta2);
    const y2 = y1 + state.L2 * scale * Math.cos(p.theta2);
    return { x1, y1, x2, y2 };
  }

  function energyOf(p) {
    const { L1, L2, m1, m2, g } = state;
    const th1 = p.theta1, th2 = p.theta2, w1 = p.omega1, w2 = p.omega2;
    const y1 = -L1 * Math.cos(th1);
    const y2 = y1 - L2 * Math.cos(th2);
    const pot = m1 * g * y1 + m2 * g * y2;
    const v1x = L1 * w1 * Math.cos(th1);
    const v1y = L1 * w1 * Math.sin(th1);
    const v2x = v1x + L2 * w2 * Math.cos(th2);
    const v2y = v1y + L2 * w2 * Math.sin(th2);
    const kin = 0.5 * m1 * (v1x * v1x + v1y * v1y) + 0.5 * m2 * (v2x * v2x + v2y * v2y);
    return { kin, pot, tot: kin + pot };
  }

  function deriv(th1, th2, w1, w2) {
    const { L1, L2, m1, m2, g, friction } = state;
    const delta = th1 - th2;
    const den = 2 * m1 + m2 - m2 * Math.cos(2 * delta);
    let a1 = (-g * (2 * m1 + m2) * Math.sin(th1) - m2 * g * Math.sin(th1 - 2 * th2)
      - 2 * Math.sin(delta) * m2 * (w2 * w2 * L2 + w1 * w1 * L1 * Math.cos(delta))) / (L1 * den);
    let a2 = (2 * Math.sin(delta) * (w1 * w1 * L1 * (m1 + m2) + g * (m1 + m2) * Math.cos(th1)
      + w2 * w2 * L2 * m2 * Math.cos(delta))) / (L2 * den);
    a1 -= friction * w1; a2 -= friction * w2;
    return [w1, w2, a1, a2];
  }

  function rk4Pend(p, dt) {
    const y = [p.theta1, p.theta2, p.omega1, p.omega2];
    const k1 = deriv(...y);
    const k2 = deriv(y[0]+.5*dt*k1[0], y[1]+.5*dt*k1[1], y[2]+.5*dt*k1[2], y[3]+.5*dt*k1[3]);
    const k3 = deriv(y[0]+.5*dt*k2[0], y[1]+.5*dt*k2[1], y[2]+.5*dt*k2[2], y[3]+.5*dt*k2[3]);
    const k4 = deriv(y[0]+dt*k3[0], y[1]+dt*k3[1], y[2]+dt*k3[2], y[3]+dt*k3[3]);
    p.theta1 += (dt/6)*(k1[0]+2*k2[0]+2*k3[0]+k4[0]);
    p.theta2 += (dt/6)*(k1[1]+2*k2[1]+2*k3[1]+k4[1]);
    p.omega1 += (dt/6)*(k1[2]+2*k2[2]+2*k3[2]+k4[2]);
    p.omega2 += (dt/6)*(k1[3]+2*k2[3]+2*k3[3]+k4[3]);
  }

  // ——— UI helpers ———
  function setPanelHidden(h) {
    panelHidden = h;
    ui.classList.toggle('hidden', h);

    $('th1').textContent = ((state.theta1 * 180) / Math.PI).toFixed(2) + '°';

    const e = energyOf(pendulums[0] || { theta1:state.theta1, theta2:state.theta2, omega1:state.omega1, omega2:state.omega2 });
    $('e-val').textContent = e.tot.toFixed(2);
    const st = $('stability');

  function syncSliders() {
    const map = {
      g:'g', fric:'friction', time:'timeScale', l1:'L1', l2:'L2', m1:'m1', m2:'m2',
      'pan-sens':'panSens', 'zoom-sens':'zoomSens', 'auto-hide':'autoHide', 'show-charts':'showCharts',
      'chart-size':'chartSize',
      bg:'bg', trail:'trail', 'trail-both':'trailBoth', 'trail-style':'trailStyle',
      'trail-c1':'trailC1', 'trail-c2':'trailC2', 'trail-w':'trailWidth', 'trail-len':'trailLen',
      'trail-inf':'trailInfinite', 'trail-op':'trailOpacity', 'trail-fade':'trailFade', 'trail-soft':'trailSoft',
    };
    for (const [id, key] of Object.entries(map)) {
      const el = $(id);
      if (!el) continue;
      let v = state[key];
      if (typeof v === 'boolean') v = v ? 1 : 0;

  function hexToRgb(hex) {

  function mixRgb(a,b,t){ return { r:a.r+(b.r-a.r)*t, g:a.g+(b.g-a.g)*t, b:a.b+(b.b-a.b)*t }; }
  function rgba(c,a){ return `rgba(${c.r|0},${c.g|0},${c.b|0},${a})`; }

  function tipSpeed(p, which) {
    // Physical tip speed in "world" units (independent of zoom)
    const { L1, L2 } = state;
    const w1 = p.omega1, w2 = p.omega2, th1 = p.theta1, th2 = p.theta2;
    const v1x = L1 * w1 * Math.cos(th1);
    const v1y = L1 * w1 * Math.sin(th1);
    if (which === 1) return Math.hypot(v1x, v1y);
    const v2x = v1x + L2 * w2 * Math.cos(th2);
    const v2y = v1y + L2 * w2 * Math.sin(th2);
    return Math.hypot(v2x, v2y);

  function speedNorm(speed, peak) {
    // Contrast-heavy mapping: slow stays cool, fast pops warm
    const n = Math.min(1, speed / Math.max(0.35, peak * 0.85));
    return Math.pow(n, 0.55);
  }

  function trailColor(i, len, speed, hueBase, which) {
    const u = i / Math.max(1, len - 1);
    const fade = state.trailFade ? (0.25 + 0.75 * u) : 1;
    let alpha = state.trailOpacity * fade;
    const c1 = hexToRgb(state.trailC1), c2 = hexToRgb(state.trailC2);
    switch (state.trailStyle) {
      case 'solid':
        // m1 uses B, m2 uses A so dual trails stay distinct
        return rgba(which === 1 ? c2 : c1, alpha * (which === 1 ? 0.75 : 1));
      case 'speed': {
        const s = speedNorm(speed, speedPeak);
        // Same absolute scale & direction for m1 and m2: A (slow) → B (fast)
        const col = mixRgb(c1, c2, s);
        alpha *= (which === 1 ? 0.7 : 1) * (0.35 + s * 0.75);
        return rgba(col, alpha);
      }
      case 'rainbow': {
        const base = which === 1 ? hueBase + 80 : hueBase;
        return `hsla(${(base + u * 140 + speed * 8) % 360},62%,${48 + speedNorm(speed, speedPeak) * 18}%,${alpha})`;
      }
      default:
        return rgba(mixRgb(which === 1 ? c2 : c1, which === 1 ? c1 : c2, u), alpha * (which === 1 ? 0.7 : 1));
    }
  }

  function drawTrailArr(arr, hue, which) {
    if (!state.trail || arr.length < 2) return;
    const k = zoomK();
    ctx.lineCap = state.trailSoft ? 'round' : 'butt';
    ctx.lineJoin = state.trailSoft ? 'round' : 'miter';
    // Always connect consecutive samples only. Skipping indices (old stride)
    // created chords through the pivot → star artifact.
    const step = arr.length > 12000 ? 2 : 1;
    for (let i = step; i < arr.length; i += step) {
      const p0 = arr[i - step];
      const p1 = arr[i];
      if (p1.brk) continue;
      const dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
      if (dist > TRAIL_BREAK) continue;
      const speed = p1.spd != null ? p1.spd : dist;
      const u = i / arr.length;
      const s = state.trailStyle === 'speed' ? speedNorm(speed, speedPeak) : 0;
      let width = state.trailWidth * k * (state.trailFade ? 0.45 + u * 0.7 : 1);
      if (state.trailStyle === 'speed') width *= 0.55 + s * 1.35;
      if (which === 1) width *= 0.85;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineWidth = width;
      ctx.strokeStyle = trailColor(i, arr.length, speed, hue, which);
      ctx.stroke();
    }
  }

  function drawBob(x, y, mass, color, active) {
    const k = zoomK();
    const r = (10 + mass * 7) * k;
    const g = ctx.createRadialGradient(x - r*0.3, y - r*0.35, r*0.1, x, y, r);
    g.addColorStop(0, '#f3efe6'); g.addColorStop(0.35, color); g.addColorStop(1, 'rgba(10,12,16,.9)');
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = g; ctx.fill();
    if (active) {
      ctx.beginPath(); ctx.arc(x, y, r + 5*k, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(212,165,116,.7)'; ctx.lineWidth = 1.5*k; ctx.stroke();
    }
  }

      const vals = energyHist;
      let min = Infinity, max = -Infinity;
      for (const v of vals) { min = Math.min(min, v.pot, v.kin, v.tot); max = Math.max(max, v.pot, v.kin, v.tot); }
      const pad = (max - min) * 0.1 || 1;
      min -= pad; max += pad;
      const plot = (key, color) => {
        ectx.beginPath();
        for (let i = 0; i < vals.length; i++) {
          const x = 12 + (i / (vals.length - 1)) * (ew - 24);
          const y = eh - 12 - ((vals[i][key] - min) / (max - min)) * (eh - 24);
          if (i === 0) ectx.moveTo(x, y); else ectx.lineTo(x, y);
        }
        ectx.strokeStyle = color; ectx.lineWidth = lw; ectx.stroke();
      };
      plot('pot', '#6f9e8e'); plot('kin', '#d4a574'); plot('tot', '#e8ebe6');
    }

    pctx.fillStyle = 'rgba(12,14,18,0.35)';
    pctx.fillRect(0, 0, pw, ph);
    if (phaseHist.length > 1) {
      let min1=Infinity,max1=-Infinity,min2=Infinity,max2=-Infinity;
      for (const v of phaseHist) {
        min1=Math.min(min1,v.th1); max1=Math.max(max1,v.th1);
        min2=Math.min(min2,v.th2); max2=Math.max(max2,v.th2);
      }
      const dx=(max1-min1)||1, dy=(max2-min2)||1;
      pctx.beginPath();
      for (let i=0;i<phaseHist.length;i++){
        const x = 14 + ((phaseHist[i].th1-min1)/dx)*(pw-28);
        const y = ph-14 - ((phaseHist[i].th2-min2)/dy)*(ph-28);
        if(i===0) pctx.moveTo(x,y); else pctx.lineTo(x,y);
      }
      pctx.strokeStyle = '#d4a574'; pctx.lineWidth = lw; pctx.stroke();
    }
  }

  function draw() {
    ctx.fillStyle = state.bg;
    ctx.fillRect(0, 0, innerWidth, innerHeight);
    const k = zoomK();
    const bg = hexToRgb(state.bg);
    const gridA = (bg.r+bg.g+bg.b)/3 > 140 ? 0.06 : 0.035;
    ctx.strokeStyle = `rgba(232,235,230,${gridA})`; ctx.lineWidth = 1;
    const step = Math.max(12, 48 * k);
    const ox = ((pivot.x % step)+step)%step, oy = ((pivot.y % step)+step)%step;
    for (let x=ox; x<innerWidth; x+=step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,innerHeight); ctx.stroke(); }
    for (let y=oy; y<innerHeight; y+=step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(innerWidth,y); ctx.stroke(); }

    const p = pendulums[0];
    if (p) {
      if (state.trailBoth) drawTrailArr(p.trail1, p.hue + 40, 1);
      drawTrailArr(p.trail2, p.hue, 2);
    }

    if (!state.running && p) {
      ctx.strokeStyle = 'rgba(232,235,230,0.06)'; ctx.setLineDash([4,8]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(pivot.x, pivot.y, state.L1*scale, 0, Math.PI*2); ctx.stroke();
      const {x1,y1} = positionsOf(p);
      ctx.beginPath(); ctx.arc(x1,y1, state.L2*scale, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
    }

    if (p) {
      const pos = positionsOf(p);
      ctx.beginPath();
      ctx.moveTo(pivot.x - 28*k, pivot.y - 10*k); ctx.lineTo(pivot.x + 28*k, pivot.y - 10*k);
      ctx.strokeStyle = 'rgba(232,235,230,0.35)'; ctx.lineWidth = 3*k; ctx.lineCap='round'; ctx.stroke();
      ctx.beginPath(); ctx.arc(pivot.x, pivot.y, 5*k, 0, Math.PI*2); ctx.fillStyle='#cfc8bc'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(pivot.x,pivot.y); ctx.lineTo(pos.x1,pos.y1);
      ctx.strokeStyle='rgba(232,235,230,0.55)'; ctx.lineWidth=2.2*k; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pos.x1,pos.y1); ctx.lineTo(pos.x2,pos.y2); ctx.stroke();
      drawBob(pos.x1, pos.y1, state.m1, '#6f9e8e', hover===1||drag===1);
      drawBob(pos.x2, pos.y2, state.m2, '#d4a574', hover===2||drag===2);
    }
    drawCharts();
  }

  function resize() {
    const dpr = Math.min(devicePixelRatio||1, 2);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const prev = { ...basePivot };
    basePivot.x = innerWidth * 0.56; basePivot.y = innerHeight * 0.26;
    if (!pivot.x && !pivot.y) { pivot.x = basePivot.x; pivot.y = basePivot.y; }
    else panBy(basePivot.x - prev.x, basePivot.y - prev.y);
    const nextRef = Math.min(innerWidth, innerHeight) * 0.22;
    const z = scale / (refScale || nextRef);
    refScale = nextRef; scale = refScale * (z || 1);
    draw();
  }
  addEventListener('resize', resize);

  let last = performance.now();
  function frame(now) {
    rafId = 0;
    if (helpOpen) return; // paused while help dialog is visible
    const dtReal = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (state.running) {
      let acc = Math.min(dtReal * state.timeScale, 0.35);
      stabilityBad = state.timeScale >= 5 || acc > 0.2;
      let guard = 0;
      while (acc > 0 && guard++ < 1200) {
        const step = Math.min(PHYS_DT, acc);
        for (const p of pendulums) rk4Pend(p, step);
        acc -= step;
        trailSampleAcc += step;
        while (trailSampleAcc >= TRAIL_SAMPLE_DT) {
          trailSampleAcc -= TRAIL_SAMPLE_DT;
          for (const p of pendulums) {
            const pos = positionsOf(p);
            const s2 = tipSpeed(p, 2), s1 = tipSpeed(p, 1);
            speedPeak = Math.max(s1, s2, speedPeak * 0.995);
            pushPt(p.trail2, 'last2', p, pos.x2, pos.y2, s2);
            if (state.trailBoth) pushPt(p.trail1, 'last1', p, pos.x1, pos.y1, s1);
          }
        }
      }
      for (const p of pendulums) {
        const pos = positionsOf(p);
        const s2 = tipSpeed(p, 2), s1 = tipSpeed(p, 1);
        pushPt(p.trail2, 'last2', p, pos.x2, pos.y2, s2);
        if (state.trailBoth) pushPt(p.trail1, 'last1', p, pos.x1, pos.y1, s1);
      }
      syncPrimaryFromPendulum();
      const e = energyOf(pendulums[0]);
      energyHist.push(e);
      if (energyHist.length > ENERGY_HIST) energyHist.shift();
      phaseHist.push({ th1: pendulums[0].theta1, th2: pendulums[0].theta2 });
      if (phaseHist.length > PHASE_HIST) phaseHist.shift();
      if (e0 != null && Math.abs(e.tot - e0) > Math.max(2, Math.abs(e0) * 0.35) && state.friction < 0.01) {
        stabilityBad = true;
      }
      updateLabels();
    }
    draw();
    rafId = requestAnimationFrame(frame);
  }

  // Init
  loadLocal();
  applyUrl();
  rebuildClones(false);
  syncSliders();
  applyI18n();
  applyChartSizeScale();
  refScale = Math.min(innerWidth, innerHeight) * 0.22;
  scale = refScale;
  resize();
  rafId = requestAnimationFrame(frame);
  setTimeout(() => $('hint').classList.add('fade'), 5500);
})();
</script>
</body>
</html>
